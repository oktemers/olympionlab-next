name: Code quality and production build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: olympion-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript and Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Public build-time placeholders only; never expose service-role or payment secrets.
      NEXT_PUBLIC_SITE_URL: https://olympionlab.com
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-for-build-only

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Security unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: TypeScript check
        run: npm run typecheck
